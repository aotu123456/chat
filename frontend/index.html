<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>multiCHAT - 多智能体 RPG</title>
  <link rel="stylesheet" href="style.css?v=2.0.2">
</head>
<body>

  <!-- ========== 视图1:存档列表 ========== -->
  <section id="view-sessions" class="view">
    <header class="home-header">
      <div class="home-brand">
        <div class="brand-mark">⚔️</div>
        <div>
          <h1 class="logo">multiCHAT</h1>
          <p class="subtitle">多智能体 RPG · 每个存档都是一段冒险</p>
        </div>
      </div>
      <div class="home-actions">
        <span id="session-total" class="total-tag"></span>
        <button id="btn-new-session" class="btn primary big">＋ 新建存档</button>
      </div>
    </header>
    <main class="sessions-grid" id="sessions-grid"></main>
  </section>

  <!-- ========== 视图2:新建存档 ========== -->
  <section id="view-create" class="view hidden">
    <header class="page-header">
      <button class="btn ghost" id="btn-back-from-create">← 返回</button>
      <h1 class="page-title">✨ 创建新存档</h1>
      <span></span>
    </header>
    <main class="create-main">
      <div id="create-errors" class="error-bar hidden"></div>

      <!-- 分区1 基础信息 -->
      <section class="form-section open" data-sec="base">
        <h2 class="sec-head"><span>①</span> 基础信息 <button class="sec-toggle">收起</button></h2>
        <div class="sec-body">
          <div class="form-row">
            <label>存档名称 <span class="req">*</span></label>
            <input id="f-session-name" placeholder="如:晨曦镇的第一天" maxlength="30">
          </div>
          <div class="form-row">
            <label>简介</label>
            <input id="f-synopsis" placeholder="一句话概括这次冒险(留空则用世界名)">
          </div>
        </div>
      </section>

      <!-- 分区2 世界设定 -->
      <section class="form-section open" data-sec="world">
        <h2 class="sec-head"><span>②</span> 世界设定 <button class="sec-toggle">收起</button></h2>
        <div class="sec-body">

          <div class="form-block">
            <h3>▸ 总览</h3>
            <div class="form-row"><label>世界名称 <span class="req">*</span></label><input id="w-name" maxlength="30"></div>
            <div class="form-row"><label>简介</label><textarea id="w-description" rows="2"></textarea></div>
            <div class="form-row two-col">
              <div><label>题材</label><input id="w-genre" placeholder="奇幻/科幻/末世/日常..."></div>
              <div><label>基调</label><input id="w-tone" placeholder="轻松/黑暗/史诗/荒诞..."></div>
            </div>
          </div>

          <div class="form-block">
            <h3>▸ 时间</h3>
            <div class="form-row two-col">
              <div><label>时代</label><input id="w-era" placeholder="中世纪 / 近未来 2200"></div>
              <div><label>初始时段</label>
                <select id="w-time">
                  <option>清晨</option><option>上午</option><option selected>中午</option>
                  <option>下午</option><option>傍晚</option><option>夜晚</option>
                </select>
              </div>
            </div>
            <div class="form-row two-col">
              <div><label>季节</label><input id="w-season" placeholder="春季"></div>
              <div><label>历法/纪元</label><input id="w-calendar" placeholder="大陆历 1374 年"></div>
            </div>
          </div>

          <div class="form-block">
            <h3>▸ 地理</h3>
            <div class="form-row">
              <label>初始地点</label>
              <input id="w-current-location" placeholder="应填写下方地点之一">
            </div>
            <div class="form-row">
              <label>地点</label>
              <div id="w-locations"></div>
            </div>
          </div>

          <div class="form-block">
            <h3>▸ 自然</h3>
            <div class="form-row two-col">
              <div><label>初始天气</label><input id="w-weather" placeholder="晴朗"></div>
              <div><label>气候</label><input id="w-climate" placeholder="温带,多雾"></div>
            </div>
          </div>

          <div class="form-block">
            <h3>▸ 社会</h3>
            <div class="form-row"><label>主要种族</label><input id="w-races" placeholder="人类,精灵,矮人(逗号分隔)"></div>
            <div class="form-row">
              <label>势力</label>
              <div id="w-factions"></div>
            </div>
            <div class="form-row two-col">
              <div><label>律法/禁忌</label><input id="w-laws"></div>
              <div><label>文化习俗</label><input id="w-culture"></div>
            </div>
          </div>

          <div class="form-block">
            <h3>▸ 规则</h3>
            <div class="form-row two-col">
              <div><label>魔法/超能力体系</label><input id="w-magic"></div>
              <div><label>经济体系</label><input id="w-economy"></div>
            </div>
          </div>

          <div class="form-block">
            <h3>▸ 叙事</h3>
            <div class="form-row"><label>世界历史背景 <span class="req">*</span></label><textarea id="w-history" rows="3"></textarea></div>
            <div class="form-row"><label>核心冲突</label><input id="w-conflict"></div>
            <div class="form-row"><label>剧情线索</label><input id="w-hooks" placeholder="线索1;线索2(分号分隔)"></div>
            <div class="form-row"><label>开局事件</label><input id="w-initial-events" placeholder="事件1;事件2(分号分隔)"></div>
          </div>

        </div>
      </section>

      <!-- 分区3 角色 -->
      <section class="form-section open" data-sec="chars">
        <h2 class="sec-head"><span>③</span> 角色(NPC) <span class="sec-count" id="char-count">0 个</span>
          <button class="btn tiny" id="btn-add-char">＋ 添加角色</button> <button class="sec-toggle">收起</button></h2>
        <div class="sec-body" id="char-editors"></div>
      </section>

      <!-- 分区4 我的角色 -->
      <section class="form-section open" data-sec="player">
        <h2 class="sec-head"><span>④</span> 我的角色(扮演) <span class="sec-badge">⚠️ 智能体只能看到你的公开信息</span>
          <button class="sec-toggle">收起</button></h2>
        <div class="sec-body" id="player-editor"></div>
      </section>

      <div class="create-footer">
        <div id="create-errors-foot" class="error-bar hidden"></div>
        <button id="btn-submit-create" class="btn primary big">🏰 创建并进入</button>
      </div>
    </main>
  </section>

  <!-- ========== 视图3:聊天 ========== -->
  <section id="view-chat" class="view hidden">
    <header class="chat-topbar">
      <button class="btn ghost" id="btn-back-to-list">← 存档列表</button>
      <div class="topbar-title">
        <span id="chat-session-name" class="session-name" title="双击改名"></span>
        <span id="chat-genre" class="badge hidden"></span>
      </div>
      <div class="topbar-right">
        <span id="chat-player" class="player-tag"></span>
        <button class="btn danger tiny" id="btn-delete-session">删除</button>
      </div>
    </header>
    <div class="chat-layout">
      <aside class="chat-sidebar" id="chat-sidebar"></aside>
      <main class="chat-area">
        <div id="messages" class="messages">
          <div class="welcome">
            <h2>冒险即将开始</h2>
            <p>和世界中的角色们聊聊吧。</p>
          </div>
        </div>
        <div class="input-bar">
          <input type="text" id="message-input" autocomplete="off" placeholder="以你的角色身份说...(Enter 发送)">
          <button id="send-btn" class="btn primary">发送</button>
          <button id="image-btn" class="btn secondary">🎨 生成场景图</button>
        </div>
      </main>
    </div>
  </section>

  <!-- 模态确认框 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div class="modal">
      <h3 id="modal-title">确认</h3>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="modal-cancel">取消</button>
        <button class="btn danger" id="modal-ok">确认</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/script.js"></script>
</body>
</html>
